name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m py_compile app/*.py
      - run: python -c "import app.main"
        env: { DATA_DIR: /tmp/tm-data, LIB_DIR: /tmp/tm-lib, IMG_DIR: /tmp/tm-img/teddy-manager, TC_CONFIG_DIR: /tmp }
      - run: python -m pytest -q
      - run: node -e "new Function(require('fs').readFileSync('static/i18n.js','utf8')+require('fs').readFileSync('static/app.js','utf8'))"
      - run: docker build -t teddy-manager:ci .
